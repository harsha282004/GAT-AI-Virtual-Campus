<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroImgTitle">
  <title id="heroImgTitle">Global Academy of Technology campus — placeholder illustration</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F235C" />
      <stop offset="0.55" stop-color="#1B36AE" />
      <stop offset="1" stop-color="#2344D4" />
    </linearGradient>
    <linearGradient id="glow" x1="800" y1="200" x2="800" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B7BFF" stop-opacity="0.35" />
